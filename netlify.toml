# Netlify builds the site from this repository on every push.
[build]
  publish = "web"
  command = "node tools/build-web.js"

[functions]
  directory = "netlify/functions"

# The app itself is revalidated on every load (it changes with every push);
# the quest database changes only with an import, so it may be kept a day.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/classic/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
